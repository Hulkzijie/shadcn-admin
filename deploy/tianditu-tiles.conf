# 自建底图瓦片服务：对外 /map/{z}/{x}/{y}.png、/anno/{z}/{x}/{y}.png
# 内部反向代理天地图 WMTS，并按 URL 缓存。前端不接触上游地址和 tk。
#
# 部署：
#   1. 把 __TK__ 换成天地图「服务端」类型的 tk（console.tianditu.gov.cn 申请）
#   2. cp 到 /etc/nginx/conf.d/tianditu-tiles.conf
#   3. mkdir -p /var/cache/nginx/tianditu && nginx -t && nginx -s reload
#
# 前端对应配置：
#   VITE_MAP_TILE_URL=/map/{z}/{x}/{y}.png
#   VITE_MAP_LABEL_TILE_URL=/anno/{z}/{x}/{y}.png

proxy_cache_path /var/cache/nginx/tianditu levels=1:2 keys_zone=tianditu:100m max_size=20g inactive=30d use_temp_path=off;

upstream tianditu_vec {
    server t0.tianditu.gov.cn:443;
    server t1.tianditu.gov.cn:443;
    server t2.tianditu.gov.cn:443;
    server t3.tianditu.gov.cn:443;
    keepalive 16;
}

upstream tianditu_cva {
    server t4.tianditu.gov.cn:443;
    server t5.tianditu.gov.cn:443;
    server t6.tianditu.gov.cn:443;
    server t7.tianditu.gov.cn:443;
    keepalive 16;
}

server {
    listen 80;
    server_name map.example.com;

    # 瓦片是静态资源，统一放行跨域与浏览器缓存
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Cache-Status $upstream_cache_status always;

    # 底图（矢量地图）
    location ~ ^/map/(\d+)/(\d+)/(\d+)\.png$ {
        rewrite ^/map/(\d+)/(\d+)/(\d+)\.png$ /vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX=$1&TILEROW=$3&TILECOL=$2&tk=__TK__ break;

        proxy_pass https://tianditu_vec;
        proxy_ssl_server_name on;
        proxy_ssl_name t0.tianditu.gov.cn;
        proxy_set_header Host t0.tianditu.gov.cn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache tianditu;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Set-Cookie Expires;
    }

    # 注记（地名文字），单独一层，避免被要素图层压住
    location ~ ^/anno/(\d+)/(\d+)/(\d+)\.png$ {
        rewrite ^/anno/(\d+)/(\d+)/(\d+)\.png$ /cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX=$1&TILEROW=$3&TILECOL=$2&tk=__TK__ break;

        proxy_pass https://tianditu_cva;
        proxy_ssl_server_name on;
        proxy_ssl_name t4.tianditu.gov.cn;
        proxy_set_header Host t4.tianditu.gov.cn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache tianditu;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Set-Cookie Expires;
    }
}
