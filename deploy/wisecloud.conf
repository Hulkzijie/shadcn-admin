# ===== 底图瓦片：http 上下文，只声明一次 =====
proxy_cache_path /var/cache/nginx/tianditu levels=1:2 keys_zone=tianditu:100m max_size=20g inactive=30d use_temp_path=off;

upstream tianditu_vec {
    server t0.tianditu.gov.cn:443;
    server t1.tianditu.gov.cn:443;
    server t2.tianditu.gov.cn:443;
    server t3.tianditu.gov.cn:443;
    keepalive 16;
}
upstream tianditu_cva {
    server t4.tianditu.gov.cn:443;
    server t5.tianditu.gov.cn:443;
    server t6.tianditu.gov.cn:443;
    server t7.tianditu.gov.cn:443;
    keepalive 16;
}

# wisecloud.si HTTP 跳转 HTTPS
server {
    listen 80;
    server_name wisecloud.si www.wisecloud.si;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wisecloud.si www.wisecloud.si;

    ssl_certificate /etc/ssl/certs/wisecloud.crt;
    ssl_certificate_key /etc/ssl/private/wisecloud.key;

    root /var/www/wisecloud/main/dist;
    index index.html;

    # ===== 底图瓦片（必须在下方静态资源正则 location 之前）=====
    location ~ ^/map/(\d+)/(\d+)/(\d+)\.png$ {
        rewrite ^/map/(\d+)/(\d+)/(\d+)\.png$ /vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX=$1&TILEROW=$3&TILECOL=$2&tk=b474e7aeebd3a62954726e0f842cd81f break;

        proxy_pass https://tianditu_vec;
        proxy_ssl_server_name on;
        proxy_ssl_name t0.tianditu.gov.cn;
        proxy_set_header Host t0.tianditu.gov.cn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache tianditu;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Set-Cookie Expires;

        expires 30d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ ^/anno/(\d+)/(\d+)/(\d+)\.png$ {
        rewrite ^/anno/(\d+)/(\d+)/(\d+)\.png$ /cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX=$1&TILEROW=$3&TILECOL=$2&tk=b474e7aeebd3a62954726e0f842cd81f break;

        proxy_pass https://tianditu_cva;
        proxy_ssl_server_name on;
        proxy_ssl_name t4.tianditu.gov.cn;
        proxy_set_header Host t4.tianditu.gov.cn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache tianditu;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Set-Cookie Expires;

        expires 30d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # 后端 Java 接口反向代理（等价开发环境 Vite proxy）
    location /java-api/ {
        proxy_pass http://43.130.3.113:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由修复，刷新 404 必加
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

